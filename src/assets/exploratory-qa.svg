<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="36" height="36" fill="none">
  <!-- Outer Shield / Hex Badge with Cyber Glow -->
  <path d="M32 4L54 14V32C54 44.8 44.6 56.6 32 60C19.4 56.6 10 44.8 10 32V14L32 4Z" fill="#0E192D" stroke="url(#paint_border)" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Radar / Crosshair Circles -->
  <circle cx="32" cy="32" r="16" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="9" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>

  <!-- Compass Needle / Explorer Crosshair -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="url(#paint_cyan)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="url(#paint_cyan)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Explorer Diamond Compass Pointer -->
  <polygon points="32,20 37,32 32,44 27,32" fill="url(#paint_needle)"/>
  
  <!-- Central Pulse Target -->
  <circle cx="32" cy="32" r="3.5" fill="#10B981"/>
  
  <!-- Charter Checklist Indicators -->
  <circle cx="21" cy="21" r="2" fill="#38BDF8"/>
  <circle cx="43" cy="21" r="2" fill="#10B981"/>
  <circle cx="43" cy="43" r="2" fill="#818CF8"/>
  <circle cx="21" cy="43" r="2" fill="#FBBF24"/>

  <defs>
    <linearGradient id="paint_border" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#10B981"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="paint_cyan" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="paint_needle" x1="32" y1="20" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
</svg>
